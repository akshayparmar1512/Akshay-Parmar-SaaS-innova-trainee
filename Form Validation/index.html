<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Form Validation</h1>
    <div id="form-container">
      <form id="user-form">
        <label for="user-name">Name:</label>
        <input type="text" id="user-name" required autocomplete="off" />
        <span class="nameerr" id="name-err"></span>

        <label for="user-email">Email:</label>
        <input type="email" id="user-email" required />
        <span id="email-err"></span>

        <label for="user-password">Password:</label>
        <input type="password" id="user-password" required autocomplete="off" />
        <span id="password-err"></span>

        <label for="confirm-password">Confirm Password:</label>
        <input
          type="password"
          id="confirm-password"
          required
          autocomplete="off"
        />
        <span id="confirm-err"></span>
        <button type="submit" id="submit-btn">Submit</button>

        <!-- <input type="submit" value="submit" id="submit-btn" /> -->
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
