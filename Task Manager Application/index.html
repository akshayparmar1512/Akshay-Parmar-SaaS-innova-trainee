<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <h2>Task Manager Application</h2>

        <div class="input-container">
            <input type="text" id="user-input" name="task">
            <button id="add-btn">Add</button>
        </div>

        <div class="btn-container">
            <button id="all-btn" class="status">All</button>
            <button id="complete-btn" class="status">Completed</button>
            <button id="incomplete-btn" class="status">Incompleted</button>
        </div>

        <div class="todolist-container">
            <ul id="task-list">
            
            </ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
