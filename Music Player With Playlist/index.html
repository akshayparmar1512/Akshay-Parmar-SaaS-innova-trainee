<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body>
    <h1>Music Player</h1>
    <div class="main-container">
      <div class="form-container">
        <form action="" id="addsong-form">
          <h3>Add Song</h3>
          <label for="title">Title:</label>
          <input type="text" id="title" />

          <label for="artist">Artist:</label>
          <input type="text" id="artist" />

          <label for="song">Add Song:</label>
          <input type="file" id="song" accept="audio/*" />

          <label for="image">Add Image</label>
          <input type="file" id="image" accept="image/*" />

          <button type="submit" id="submit-btn">Submit</button>
        </form>
      </div>
      <div class="current-song-container">
        <h2>Now Playing</h2>

        <div class="song-image">
          <img src="" alt="Song Image" id="song-image" />
        </div>

        <div class="song-info">
          <h3 id="song-title">Song Title</h3>
          <p id="artist-name">Artist Name</p>
        </div>

        <div class="player-controls">
          <button id="previous-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="play-btn"><i class="fa-solid fa-play"></i></button>
          <button id="stop-btn"><i class="fa-solid fa-stop"></i></button>
          <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
        </div>
      </div>
    </div>

    <div class="playlist-container">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
