<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Listing Table</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <caption>
        Product Listing Table
      </caption>
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Availability</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Laptop</td>
          <td>HP 15.6 Inch Laptop</td>
          <td>₹55,000</td>
          <td>In Stock</td>
        </tr>

        <tr>
          <td>Mobile</td>
          <td>Samsung Galaxy</td>
          <td>₹22,000</td>
          <td>Out of Stock</td>
        </tr>

        <tr>
          <td>Headphones</td>
          <td>Wireless Bluetooth</td>
          <td>₹2,500</td>
          <td>In Stock</td>
        </tr>

        <tr>
          <td>Keyboard</td>
          <td>Mechanical Keyboard</td>
          <td>₹3,000</td>
          <td>In Stock</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
